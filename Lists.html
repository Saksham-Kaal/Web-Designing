<!DOCTYPE html>
<html>
<head>
    <title>My Lists</title>
</head>
<body>

    <h1>My First Lists:</h1>

    <!-- unordered list (bullets) -->
    <h2>My Favourite Fruits:</h2>
    <ul>
        <li>Mango</li>
        <li>Apple</li>
        <li>Banana</li>
        <li>Grapes</li>
    </ul>

    <!-- ordered list (numbers) -->
    <h2>Steps to Make Tea:</h2>
    <ol>
        <li>Boil water in a pan.</li>
        <li>Add tea leaves and sugar.</li>
        <li>Add milk.</li>
        <li>Let it boil for 2 minutes.</li>
        <li>Pour it in a cup.</li>
    </ol>

</body>
</html>
